[tool:pytest]
# pytest configuration for MST tests

# Test discovery
testpaths = .
python_files = test_*mst*.py test_create_mst.py
python_classes = Test*MST* Test*CreateMST* TestMST* TestDelaunay* TestStreet*
python_functions = test_*mst* test_*delaunay* test_*street* test_calculate_mst*

# Output and formatting
addopts = -v --tb=short --strict-markers --color=yes

# Markers for MST tests
markers =
    integration: Integration tests for MST functionality
    unit: Unit tests for individual MST components  
    performance: Performance and scalability tests
    edge_case: Edge case and boundary condition tests
    modular: Tests for modular MST components
    slow: Tests that take more than 5 seconds to run

# Minimum version requirements
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Warnings configuration
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning:qgis.*
    ignore::PendingDeprecationWarning

# Coverage configuration (when using --cov)
[coverage:run]
source = ibtool.ibtool_tools.CreateMST, ibtool.ibtool_tools.mst
omit = 
    */test_*
    */tests/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    
[coverage:html]
directory = htmlcov_mst