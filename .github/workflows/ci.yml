# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build --pull -t qgis-plugin-test .

      - name: Run tests with coverage
        run: |
          docker run --rm -v $(pwd):/plugins/ibtool qgis-plugin-test

      - name: Extract coverage reports
        run: |
          ls -la coverage.xml htmlcov/ || echo "Coverage files not found"
          # Fix absolute container paths → relative repo paths for Codecov
          if [ -f coverage.xml ]; then
            sed -i 's|/plugins/ibtool/||g' coverage.xml
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false  # Wichtig: CI nicht wegen Coverage-Upload-Fehler scheitern lassen