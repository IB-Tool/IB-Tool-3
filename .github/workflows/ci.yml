name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        qgis: ["3.40", "3.50"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build --pull --build-arg QGIS_VERSION=${{ matrix.qgis }} -t qgis-plugin-test:${{ matrix.qgis }} .

      - name: Run tests with coverage
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app qgis-plugin-test:${{ matrix.qgis }} \
            bash -c "pytest -v --tb=short --cov=. --cov-report=xml --cov-report=html"

      - name: Generate coverage badge
        run: |
          pip install coverage-badge
          coverage-badge -o htmlcov/coverage.svg -f

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload htmlcov artifact
        uses: actions/upload-artifact@v3
        with:
          name: htmlcov-${{ matrix.os }}-${{ matrix.qgis }}
          path: htmlcov
