# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build --pull -t qgis-plugin-test .

      - name: Run tests with coverage
        run: |
          docker run --rm -v $(pwd):/app qgis-plugin-test

      - name: Extract coverage reports
        run: |
          # Tests already generate coverage files in mounted volume
          # No need to extract since files are already available in host filesystem
          ls -la coverage.xml htmlcov/ || echo "Coverage files not found"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false  # Wichtig: CI nicht wegen Coverage-Upload-Fehler scheitern lassen