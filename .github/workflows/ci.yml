# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: test (QGIS ${{ matrix.qgis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported range is 3.40–4.x (metadata.txt). 3.40 = minimum version,
        # 3.44 = current LTR, 4.0 = first Qt6 release (QGIS 4). Note: both Linux images ship NumPy 1.26 — NumPy 2
        # (as in QGIS 3.44 LTR on Windows/OSGeo4W) is NOT covered by this matrix.
        qgis: ["3.40", "3.44", "4.0"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build --pull --build-arg QGIS_VERSION=${{ matrix.qgis }} -t qgis-plugin-test .

      - name: Show QGIS / NumPy versions
        run: |
          docker run --rm qgis-plugin-test python3 -c \
            "import numpy, qgis.core; print('QGIS', qgis.core.Qgis.QGIS_VERSION, '| NumPy', numpy.__version__)"

      - name: Run tests with coverage
        id: run_tests
        continue-on-error: true
        run: |
          # Run container; coverage.xml is written to /plugins/ibtool/ which maps
          # to $(pwd) via the volume mount, so it appears on the host automatically.
          docker run --rm \
            -v $(pwd):/plugins/ibtool \
            qgis-plugin-test

      # Coverage is uploaded from the 3.40 job only (same code, avoids double counting)
      - name: Verify and fix coverage report
        if: matrix.qgis == '3.40'
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml not found after test run"
            exit 1
          fi
          # Fix absolute container paths → relative repo paths for Codecov
          sed -i 's|/plugins/ibtool/||g' coverage.xml
          echo "coverage.xml found and paths fixed"
          head -5 coverage.xml

      - name: Upload coverage reports to Codecov
        if: matrix.qgis == '3.40'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "Tests failed — see output above."
          exit 1