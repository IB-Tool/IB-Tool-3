# pytest.ini
[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=ibtool
    --cov-report=xml
    --cov-report=html
    --cov-report=term-missing
    --tb=short
    -v
    --durations=10
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests