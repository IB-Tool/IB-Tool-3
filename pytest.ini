# pytest.ini
[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -v
    --durations=10
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring QGIS Processing
    unit: marks tests as unit tests (no processing.run(), no file I/O)
    edge_case: marks tests that exercise boundary or degenerate inputs (combine with unit or integration)
    performance: marks tests that measure time or memory on large datasets (combine with slow)